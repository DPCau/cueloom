[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cueloom"
version = "0.1.0"
description = "Local media to translated subtitle files (SRT/VTT/ASS) via a self-hosted OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DPCau" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "pysubs2>=1.8",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

# 许可证未定（D-01）：不写 license 字段、不创建 LICENSE 文件。

[project.scripts]
cueloom = "cueloom.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/cueloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
